<script type="text/javascript">
    RED.nodes.registerType('chatbox-trigger-node',{
        category: 'function',
        color: '#a6bbcf',
        outputs: 1,
        label: function() {
            return this.id || this.name
        },
        defaults: {
            nodeId: { value: "" }
        },
        oneditprepare: function () {
            $("#node-input-nodeId").val(this.id);
        }
    });
</script>

<script type="text/html"  data-template-name="chatbox-trigger-node">
    <div class="form-row">
        <label for="node-input-nodeId"><i class="fa fa-tag"></i> Node Id</label>
        <input type="text" id="node-input-nodeId" placeholder="nodeId" readonly>
    </div>
</script>

<script type="text/html" data-help-name="chatbox-trigger-node">
    <p>A simple node to trigger?</p>
</script>
